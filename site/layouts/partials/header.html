<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/">
      <img src="/img/logo-kupiumno.png" alt="Логотип КупиУмно" class="brand-logo">
      <span class="brand-name">Купи<span class="accent">Умно</span></span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" hidden>
    <label for="nav-toggle" class="nav-burger" aria-label="Меню">
      <span></span><span></span><span></span>
    </label>
    <nav class="site-nav">
      {{ $current := . }}
      {{ range .Site.Menus.main }}
        <a href="{{ .URL }}"
           class="{{ if $current.IsMenuCurrent "main" . }}is-active{{ else if $current.HasMenuCurrent "main" . }}is-active{{ end }}">{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
